<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simson S51 | 110N Stage 3</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #101210;
    color: #f2f2f2;
    font-family: Arial, sans-serif;
}

header {
    padding: 25px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #292d28;
}

.logo {
    color: #b5ff35;
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 3px;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
    font-size: 14px;
}

nav a:hover {
    color: #b5ff35;
}

.hero {
    min-height: 570px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px 10%;
    background: linear-gradient(90deg, #101210 35%, #101210aa),
                radial-gradient(circle at 80% 50%, #35451e, #101210 65%);
}

.tag {
    color: #b5ff35;
    letter-spacing: 4px;
    font-size: 13px;
    margin-bottom: 20px;
}

h1 {
    font-size: clamp(55px, 10vw, 110px);
    line-height: 0.95;
    font-weight: 900;
}

h1 span {
    color: #b5ff35;
}

.hero p {
    margin-top: 25px;
    color: #aaa;
    font-size: 18px;
    max-width: 500px;
    line-height: 1.6;
}

.button {
    display: inline-block;
    margin-top: 30px;
    padding: 15px 28px;
    background: #b5ff35;
    color: #101210;
    text-decoration: none;
    font-weight: bold;
    width: fit-content;
    border-radius: 3px;
}

section {
    padding: 80px 10%;
}

.section-title {
    font-size: 35px;
    margin-bottom: 15px;
}

.section-title span {
    color: #b5ff35;
}

.subtitle {
    color: #888;
    margin-bottom: 40px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}
