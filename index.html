<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simson S51 | WP Performance</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #111111;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */

header {
    background: #080808;
    padding: 25px 20px;
    text-align: center;
    border-bottom: 2px solid #e00000;
}

.logo {
    max-width: 180px;
    height: auto;
    margin-bottom: 15px;
}

.powered {
    color: #999999;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.powered span {
    color: #e00000;
    font-weight: bold;
}

header h1 {
    font-size: 35px;
    letter-spacing: 5px;
    margin-top: 15px;
}

header p {
    color: #aaaaaa;
    margin-top: 8px;
    letter-spacing: 2px;
}

/* NAVIGATION */

nav {
    background: #1a1a1a;
    padding: 15px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #333;
}

nav a {
    color: #ffffff;
    text-decoration: none;
    margin: 0 15px;
    font-size: 14px;
    transition: 0.3s;
}

nav a:hover {
    color: #e00000;
}

/* HERO */

.hero {
    min-height: 400px;
    background: linear-gradient(
        rgba(0,0,0,0.7),
        rgba(0,0,0,0.9)
    );
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 50px 20px;
}

.hero-content h2 {
    font-size: 55px;
    color: #e00000;
    letter-spacing: 5px;
}

.hero-content h3 {
    font-size: 25px;
    margin-top: 15px;
    letter-spacing: 3px;
}

.hero-content p {
    color: #aaaaaa;
    margin-top: 20px;
    font-size: 17px;
}

.button {
    display: inline-block;
    margin-top: 30px;
    padding: 14px 30px;
    background: #e00000;
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

.button:hover {
    background: #aa0000;
    transform: scale(1.05);
}

/* SECTIONS */

section {
    padding: 70px 20px;
    max-width: 1200px;
    margin: auto;
}

.section-title {
    text-align: center;
    font-size: 32px;
    margin-bottom: 40px;
    text-transform: uppercase;
    letter-spacing: 3px;
}

.section-title span {
    color: #e00000;
}

/* PROJECT */

.project {
    background: #181818;
    padding: 30px;
    border-left: 4px solid #e00000;
    line-height: 1.8;
}

.project h3 {
    color: #e00000;
    margin-bottom: 15px;
    font-size: 24px;
}

/* TECHNICAL DATA */

.specs {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.spec {
    background: #1b1b1b;
    padding: 25px;
    text-align: center;
    border-bottom: 3px solid #e00000;
    transition: 0.3s;
}

.spec:hover {
    background: #252525;
    transform: translateY(-5px);
}

.spec h3 {
    color: #e00000;
    font-size: 17px;
    margin-bottom: 12px;
}

.spec p {
    font-size: 20px;
    font-weight: bold;
}

/* AUFBAU GALERIE */

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
}

.gallery-item {
    background: #1a1a1a;
    padding: 10px;
    border: 1px solid #333;
    transition: 0.3s;
}

.gallery-item:hover {
    border-color: #e00000;
    transform: translateY(-5px);
}

.gallery-item img {
    width: 100%;
    display: block;
    height: auto;
}

.gallery-item p {
    text-align: center;
    padding: 15px;
    color: #aaaaaa;
}

/* FOOTER */

footer {
    background: #080808;
    text-align: center;
    padding: 35px 20px;
    border-top: 2px solid #e00000;
}

footer p {
    color: #888888;
    font-size: 14px;
    margin-top: 8px;
}

footer span {
    color: #e00000;
}

/* MOBILE */

@media (max-width: 600px) {

    header h1 {
        font-size: 26px;
    }

    .hero-content h2 {
        font-size: 35px;
    }

    .hero-content h3 {
        font-size: 19px;
    }

    nav a {
        display: inline-block;
        margin: 8px;
    }

    .section-title {
        font-size: 25px;
    }

}

</style>
</head>

<body>

<header>

         alt="WP Performance Logo"
         class="logo">

    <div class="powered">
        Powered by <span>WP Performance</span>
    </div>

    <h1>SIMSON S51</h1>

    <p>MY PROJECT</p>

</header>

    <a href="#daten">Technische Daten</a>
    <a href="#aufbau">Aufbau</a>
</nav>
